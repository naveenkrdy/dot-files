# =============================================================================
# ~/.config/tmux/tmux.conf
# Symlinked from dot-files/tmux/tmux.conf
# Prefix: Ctrl-a  |  Theme: Catppuccin Mocha  |  Nav: vim-tmux-navigator
# =============================================================================

# ── Plugin install path (must be before plugins/tpm run) ─────────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# ── Terminal ──────────────────────────────────────────────────────────────────
# Switch to iTerm2 or Ghostty for full 24-bit color; Apple Terminal is 256 only.
set -g default-terminal "tmux-256color"
set -ag terminal-features ",*:RGB"

# ── Prefix: Ctrl-a ────────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── Core behavior ─────────────────────────────────────────────────────────────
set -sg escape-time 10
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g set-clipboard on
set -g status-keys vi
setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string '#S · #W'

# ── Key bindings ──────────────────────────────────────────────────────────────

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Splits — always open in the pane's current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane resize with vim keys (repeatable: hold prefix and tap H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# C-l clear-screen fallback (vim-tmux-navigator grabs root-level C-l)
bind C-l send-keys 'C-l'

# Window navigation
bind -r n next-window
bind -r p previous-window

# Session/window tree switcher (built-in choose-tree, zooms pane while open)
bind s choose-tree -Zs
bind S choose-tree -Zw

# ── Copy mode → macOS clipboard ───────────────────────────────────────────────
# No reattach-to-user-namespace needed on tmux 3.x + macOS.
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# ── Plugin config ─────────────────────────────────────────────────────────────

# tmux-resurrect
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum (auto-restore on server start)
set -g @continuum-restore 'on'

# ── Catppuccin Mocha ──────────────────────────────────────────────────────────
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_window_text ' #W'

# Status bar — plain strings using catppuccin's color variables (no powerline glyphs)
# #{@thm_*} are evaluated lazily at render time after catppuccin sets them
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#[fg=#{@thm_crust},bg=#{@thm_green},bold] #S #[default] '
set -g status-right '#[fg=#{@thm_overlay_1}] #W  #[fg=#{@thm_subtext_0}]%Y-%m-%d  %H:%M '

# ── Initialize tpm (always keep this at the very bottom) ─────────────────────
# First use: press prefix + I to fetch all declared plugins.
run '~/.config/tmux/plugins/tpm/tpm'
